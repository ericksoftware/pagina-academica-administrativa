{% extends "base.html" %}
{% load static %}

{% block title %}Ver Acta - BENUNE{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="h2 text-primary-custom">Acta de Evaluación</h1>
            <p class="lead">{{ acta.materia.nombre }} - {{ acta.carrera.nombre }} - Grupo {{ acta.grupo }}</p>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="mb-3">
                <iframe src="{% url 'view_acta_pdf' acta.id %}" width="100%" height="600px" style="border: none;"></iframe>
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{% url 'acta_list' %}" class="btn btn-secondary me-md-2">
                    <i class="fas fa-arrow-left me-2"></i>Volver a la Lista
                </a>
                <a href="{% url 'download_acta' acta.id %}" class="btn btn-primary-custom">
                    <i class="fas fa-download me-2"></i>Descargar PDF
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
